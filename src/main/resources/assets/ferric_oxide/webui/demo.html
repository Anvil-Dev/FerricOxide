<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FerricOxide</title>
    <style>
        html {
            width: 100%;
            height: 100%;
            background: #1a1310;
        }

        body {
            box-sizing: border-box;
            margin: 0;
            width: 100%;
            min-height: 100%;
            overflow: hidden;
            font-family: "Segoe UI", system-ui, sans-serif;
            color: #eceff1;
            background: linear-gradient(135deg, #6d2000 0%, #31240e 55%, #1a1310 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .card {
            background: rgba(20, 14, 10, 0.82);
            border: 1px solid rgba(224, 122, 58, 0.45);
            border-radius: 14px;
            padding: 32px 40px;
            text-align: center;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55);
            max-width: 520px;
        }

        h1 {
            margin: 0 0 4px;
            font-size: 28px;
            letter-spacing: 1px;
            color: #f5b27a;
        }

        .sub {
            margin: 0 0 20px;
            font-size: 13px;
            opacity: 0.7;
        }

        button {
            background: #c05621;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 26px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.1s ease;
        }

        button:hover {
            background: #dd6b20;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        #count {
            margin-top: 18px;
            font-size: 40px;
            font-weight: 700;
            color: #ed8936;
        }

        #time {
            margin-top: 10px;
            font-size: 15px;
            color: #f5b27a;
        }

        #log {
            margin-top: 14px;
            font-size: 12px;
            opacity: 0.65;
            min-height: 1.2em;
        }

        .res-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin-top: 20px;
        }

        .res-row img {
            width: 48px;
            height: 48px;
            image-rendering: pixelated;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 6px;
            padding: 4px;
        }

        .res-row .cap {
            font-size: 11px;
            opacity: 0.7;
        }

        #entity-stage {
            width: 128px;
            height: 128px;
            margin-top: 20px;
            margin-left: auto;
            margin-right: auto;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(224, 122, 58, 0.35);
            border-radius: 10px;
            overflow: hidden;
            cursor: crosshair;
            position: relative;
        }

        #entity-stage img {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            display: block;
        }

        #entity-hint {
            margin-top: 8px;
            font-size: 11px;
            opacity: 0.6;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>FerricOxide</h1>
    <p class="sub">Native WebView rendered by Rust + WebView2</p>
    <button id="btn">Ping Minecraft</button>
    <div id="count">0</div>
    <div id="time">--</div>
    <div id="log"></div>
    <div class="res-row">
        <figure>
            <img alt="apple" id="apple">
            <figcaption class="cap">minecraft:textures/item/apple.png (resource protocol)</figcaption>
        </figure>
        <figure>
            <img alt="icon" src="icon.svg">
            <figcaption class="cap">icon.svg → ferric_oxide:webui/icon.svg</figcaption>
        </figure>
        <figure>
            <img alt="dragon_head" id="diamond">
            <figcaption class="cap">item:minecraft:dragon_head (rendered icon)</figcaption>
        </figure>
    </div>
    <div id="entity-stage">
        <img alt="entity preview" id="entity">
    </div>
    <div id="entity-hint">entity:minecraft:zombie — move the mouse to rotate</div>
    <button id="who">Who am I?</button>
    <div id="player">--</div>
</div>
<script>
    // `ferric` is installed by the bridge runtime before this script runs, so there is nothing
    // to feature-detect and no load order to worry about.

    // --- JS -> Java: one-way events -----------------------------------------
    let count = 0;
    document.getElementById('btn').addEventListener('click', () => {
        count++;
        document.getElementById('count').textContent = count;
        ferric.emit('demo.ping', {count});
        document.getElementById('log').textContent = 'sent ping #' + count;
    });

    // Esc closes the UI (the key event lands in the webview, not in Minecraft).
    document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
            ferric.emit('demo.close');
        }
    });

    // --- JS -> Java: query with a result -------------------------------------
    document.getElementById('who').addEventListener('click', async () => {
        const out = document.getElementById('player');
        try {
            const info = await ferric.call('demo.player');
            out.textContent = info.name + ' — ' + info.health.toFixed(1) + ' HP';
        } catch (error) {
            out.textContent = 'query failed: ' + error.message;
        }
    });

    // --- Java -> JS: events pushed by the mod --------------------------------
    ferric.on('demo.game_time', (time) => {
        document.getElementById('time').textContent = 'Game time: ' + time.ticks + ' ticks';
    });

    ferric.on('demo.entity_frame', (frame) => {
        document.getElementById('entity').src = frame.dataUrl;
    });

    // --- Entity preview: follow the pointer, like the inventory preview ------
    (() => {
        const stage = document.getElementById('entity-stage');
        const hint = document.getElementById('entity-hint');
        let rafPending = false;
        document.addEventListener('mousemove', (event) => {
            const rect = stage.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const yaw = Math.atan((centerX - event.clientX) / 40.0);
            const pitch = Math.atan((centerY - event.clientY) / 40.0);
            if (rafPending) return;
            rafPending = true;
            requestAnimationFrame(() => {
                rafPending = false;
                ferric.emit('demo.rotate', {yaw, pitch});
            });
        });
        // Initial frame: request the first render through the resource protocol.
        document.getElementById('entity').src = ferric.resource('entity/minecraft:zombie', {size: 128});
        setTimeout(() => {
            hint.textContent = 'move the mouse over the zombie to rotate';
        }, 8000);
    })();

    // --- Game resources: ferric.resource() hides the platform protocol -------
    document.getElementById('apple').src = ferric.resource('minecraft/textures/item/apple.png');
    // Rendered item icon: the mod renders the ItemStack off-screen and serves the PNG.
    document.getElementById('diamond').src = ferric.resource('item/minecraft:dragon_head', {size: 48});
</script>
</body>
</html>
