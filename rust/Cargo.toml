[package]
name = "ferric_oxide_native"
version = "0.1.0"
edition = "2021"
description = "Native WebView bridge for FerricOxide (JNI)"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.22"
wry = { version = "0.56", features = ["devtools"] }
tao = "0.36"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3.1"

# Offscreen WebView2 (composition controller + WinRT compositor + Windows.Graphics.Capture).
# Versions are pinned to the ones already pulled in transitively by wry.
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows-numerics = "0.2"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_UI_WindowsAndMessaging",
    "Foundation",
    "Foundation_Numerics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "System",
    "UI_Composition",
] }

[profile.release]
lto = true
codegen-units = 1
