plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// --- Rust native library (JNI WebView bridge) -------------------------------

def nativePlatformDir = {
    String os = System.getProperty("os.name").toLowerCase(Locale.ROOT)
    String arch = System.getProperty("os.arch").toLowerCase(Locale.ROOT)
    String platform = os.contains("win") ? "windows" : (os.contains("mac") ? "macos" : "linux")
    String normalizedArch
    if (arch in ["x86", "i386", "i486", "i586", "i686"]) {
        normalizedArch = "x86"
    } else if (arch in ["x86_64", "amd64"]) {
        normalizedArch = "x86_64"
    } else if (arch in ["aarch64", "arm64"]) {
        normalizedArch = "aarch64"
    } else {
        throw new GradleException("Unsupported CPU architecture for native WebView: ${arch}")
    }
    return "${platform}/${normalizedArch}"
}()

def nativeLibName = {
    String os = System.getProperty("os.name").toLowerCase(Locale.ROOT)
    if (os.contains("win")) return "ferric_oxide_native.dll"
    if (os.contains("mac")) return "libferric_oxide_native.dylib"
    return "libferric_oxide_native.so"
}()

def prebuiltNativesDir = providers.gradleProperty("prebuiltNativesDir").map { file(it) }
def cargoTargetDir = layout.buildDirectory.dir("cargo")
def builtNativeLib = cargoTargetDir.map { it.file("release/${nativeLibName}") }
def packagedNativeDir = layout.buildDirectory.dir("natives/${nativePlatformDir}")

def buildRustNative = tasks.register("buildRustNative", Exec) {
    group = "build"
    description = "Compiles the Rust JNI native library in release mode."
    workingDir "rust"
    environment "CARGO_TARGET_DIR", cargoTargetDir.get().asFile.absolutePath
    commandLine "cargo", "build", "--release"
    inputs.dir "rust/src"
    inputs.file "rust/Cargo.toml"
    inputs.file "rust/Cargo.lock"
    outputs.file builtNativeLib
}

def packageRustNative = tasks.register("packageRustNative", Copy) {
    group = "build"
    description = "Copies the compiled native library into the mod jar resources."
    dependsOn buildRustNative
    from(builtNativeLib)
    into packagedNativeDir
}

// Run configs see the freshly built DLL through this override; the packaged jar
// uses the /natives/ resource instead.
def devNativePath = packagedNativeDir.map { it.file(nativeLibName).asFile.absolutePath }

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // Exposes private rendering instances (GuiRenderer internals) to the mod sources.
    accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG

            // Points NativeLoader at the freshly built native library
            systemProperty 'ferricoxide.native.path', devNativePath.get()
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Bundle native libraries into the jar at /natives/<platform>/<arch>/.... CI supplies all
// targets through prebuiltNativesDir; local builds compile and package only the host target.
tasks.named("processResources") {
    if (prebuiltNativesDir.isPresent()) {
        File sourceDir = prebuiltNativesDir.get()
        if (!sourceDir.isDirectory()) {
            throw new GradleException("prebuiltNativesDir is not a directory: ${sourceDir}")
        }
        inputs.dir(sourceDir)
        from(sourceDir) { into "natives" }
    } else {
        dependsOn packageRustNative
        from(layout.buildDirectory.dir("natives")) { into "natives" }
    }
}

// Dev runs (runClient, runServer, ...) need the DLL built and copied first.
tasks.matching { it.name.startsWith("run") }.configureEach { dependsOn packageRustNative }


dependencies {
    // Example mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-forge-api:${jei_version}"
    // runtimeOnly "mezz.jei:jei-${mc_version}-forge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

    // Pure-Java unit tests for the public API (no Minecraft runtime needed).
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testImplementation "com.google.code.gson:gson:2.11.0"
    testImplementation "org.slf4j:slf4j-api:2.0.16"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    // JSpecify null-safety annotations, used directly by the mod sources. Already supplied
    // transitively by NeoForge, but declared explicitly so we do not rely on transitivity.
    compileOnly "org.jspecify:jspecify:1.0.0"
}

test {
    useJUnitPlatform()
}

// The page-side half of the WebUI bridge is JavaScript, so it is covered by Node's built-in test
// runner rather than JUnit. Wired into `check` so `./gradlew build` exercises both halves.
var testJs = tasks.register("testJs", Exec) {
    description = "Runs the bridge runtime tests with the Node test runner."
    group = "verification"
    inputs.file("src/main/resources/assets/ferric_oxide/webui/bridge.js")
    inputs.file("src/test/js/bridge.test.js")
    // Exec always reruns without a declared output; this marker only carries up-to-date state.
    outputs.file(layout.buildDirectory.file("test-results/testJs/passed.txt"))

    var marker = layout.buildDirectory.file("test-results/testJs/passed.txt").get().asFile
    commandLine "node", "--test", "src/test/js/bridge.test.js"
    doLast {
        marker.parentFile.mkdirs()
        marker.text = "passed"
    }
}

tasks.named("check") {
    dependsOn testJs
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
