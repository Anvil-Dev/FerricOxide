name: CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'rust/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
